name: Perbarui Harga BBM

on:
  schedule:
    # Setiap hari pukul 18:50 UTC (02:50 WITA / 01:50 WIB). Cron GitHub memakai zona UTC.
    # Sengaja tidak di menit :00 — awal jam adalah waktu tersibuk GitHub Actions dan
    # jadwal sering tertunda lama; dengan begini job diharapkan mulai sekitar 03:00 WITA.
    - cron: "50 18 * * *"
  workflow_dispatch: {} # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ambil harga terbaru
        run: node scripts/fetch-prices.mjs

      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data api
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: perbarui harga BBM ($(TZ=Asia/Jakarta date +%Y-%m-%d))"
            git push
            echo "Data diperbarui dan di-push."
          fi
